    <line x1="22" y1="52" x2="108" y2="42" stroke="#EBDDC0" stroke-width="5" stroke-linecap="round"/>
    <line x1="22" y1="74" x2="108" y2="64" stroke="#EBDDC0" stroke-width="5" stroke-linecap="round"/>
    <line x1="22" y1="96" x2="88" y2="88" stroke="#EBDDC0" stroke-width="5" stroke-linecap="round"/>
    <line x1="152" y1="42" x2="238" y2="52" stroke="#EBDDC0" stroke-width="5" stroke-linecap="round"/>
    <line x1="152" y1="64" x2="238" y2="74" stroke="#EBDDC0" stroke-width="5" stroke-linecap="round"/>

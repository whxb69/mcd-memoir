  <text x="600" y="70" text-anchor="middle" font-family="Georgia,'Songti SC',serif" font-size="52" font-weight="800" fill="#2B1D0E">麦门人生回忆录</text>
  <text x="600" y="118" text-anchor="middle" font-family="-apple-system,'PingFang SC',sans-serif" font-size="20" fill="#2B1D0E" opacity=".75">MCD MEMOIR · 你的每一单，都值得一页纸</text>

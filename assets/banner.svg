      <stop offset="0" stop-color="#FFC72C"/>
      <stop offset="1" stop-color="#F5B800"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" fill="url(#bg)"/>
  <!-- golden arches watermark -->
  <path d="M 1050 40 Q 1090 -90 1130 40" fill="none" stroke="#DA291C" opacity=".12" stroke-width="26" stroke-linecap="round"/>
  <path d="M 70 320 Q 110 190 150 320" fill="none" stroke="#DA291C" opacity=".12" stroke-width="26" stroke-linecap="round"/>
  <!-- open book -->
